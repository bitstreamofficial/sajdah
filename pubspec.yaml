name: sajdah
description: A beautiful Salah tracking app with auto-silence and widget support

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.0.5
  
  # Prayer time calculations
  adhan_dart: ^2.0.1
  
  # Location services
  geolocator: ^9.0.2
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Notifications
  flutter_local_notifications: ^15.1.0+1
  timezone: ^0.9.2
  
  # Internationalization
  intl: ^0.18.1
  
  # Permissions
  permission_handler: ^10.4.3
  
  # Background tasks
  android_alarm_manager_plus: ^3.0.1
  
  # # Platform channels
  # flutter/services.dart (built-in)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sounds/